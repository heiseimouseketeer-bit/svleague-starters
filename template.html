<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SVリーグ女子 全チームスタメン（ホーム画面用）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SV女子スタメン">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14284b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#18202f; --sub:#5f6b80; --line:#dde3ee;
  --navy:#14284b; --navy-ink:#fff; --lib:#e0802b; --lib-ink:#fff;
  --court:#eaf1fb; --court-line:#9db3d6; --win:#1f8a4c; --lose:#b5483a; --chip:#e7ecf6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1420; --card:#18202f; --ink:#e8edf7; --sub:#9aa7bf; --line:#2a3550;
    --navy:#5b86d6; --navy-ink:#0b1426; --lib:#f0a04a; --lib-ink:#1b1206;
    --court:#1d2a44; --court-line:#3d5280; --win:#4fc384; --lose:#e8806f; --chip:#25304a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 8px;font-weight:700}
.sub{color:var(--sub);font-size:12px}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{max-width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.picker button[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
h2{font-size:15px;margin:22px 0 8px;color:var(--sub);font-weight:700}
.m{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.vs{font-weight:700;font-size:16px}
.ha{display:inline-block;font-size:11px;background:var(--chip);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;color:var(--sub);font-weight:600}
.res{font-weight:700;font-variant-numeric:tabular-nums}
.res.w{color:var(--win)} .res.l{color:var(--lose)} .res.p{color:var(--sub)}
.meta{color:var(--sub);font-size:12px;margin:2px 0 8px}
.meta a{color:inherit}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(168px,100%),1fr));gap:10px}
.set{border:1px solid var(--line);border-radius:12px;padding:8px}
.sh{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px}
.court{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px;background:var(--court);border:2px solid var(--court-line);border-radius:8px;padding:5px;position:relative}
.court::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--court-line);opacity:.0}
.net{height:3px;background:var(--court-line);border-radius:2px;margin:0 0 3px;opacity:.9}
.cell{text-align:center;padding:3px 0 2px;min-width:0}
.badge{width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.nm{font-size:11px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.pos{display:block;font-size:9px;color:var(--sub)}
.libs{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px}
.libs .badge{background:var(--lib);color:var(--lib-ink);width:24px;height:24px;font-size:12px;position:relative}
.libs .l{font-size:8px;position:absolute;right:-3px;top:-4px;background:var(--card);color:var(--lib);border:1px solid var(--lib);border-radius:50%;width:12px;height:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
.libs .lbl{display:inline-flex;align-items:center;gap:4px}
.note{font-size:11px;color:var(--sub);margin-top:4px}
.empty{color:var(--sub);padding:24px 0;text-align:center}
footer{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--sub);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>SVリーグ女子 全チームスタメン</h1>
  <div class="picker" id="picker" role="group" aria-label="チームを選ぶ"></div>
  <div class="sub" id="asof"></div>
</header>
<main id="main"></main>
<footer>データ出典：SVリーグ公式サイトの公式帳票（帳票B／A）。コート図はポジション1が右下、反時計回りに1→6。上段が前衛(4・3・2)、下段が後衛(5・6・1)。紺の丸が先発、橙のLがリベロ。</footer>
<script>
var MATCHES = [];
</script>
<script>
(function(){
  var NAVY_TEAMS = {};
  var $ = function(id){return document.getElementById(id)};
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  var teams = {};
  MATCHES.forEach(function(m){teams[m.h]=1;teams[m.a]=1});
  var names = Object.keys(teams).sort(function(a,b){return a.localeCompare(b,"ja")});
  var KEY="svw-team", cur=null;
  try{cur=localStorage.getItem(KEY)}catch(e){}
  if(!teams[cur]) cur=names[0];
  var played = MATCHES.filter(function(m){return m.st==="played"});
  var last = played.reduce(function(a,m){return m.d>a?m.d:a},"");
  var lastRound = played.reduce(function(a,m){return m.r>a?m.r:a},0);
  $("asof").textContent = "第"+lastRound+"節まで反映（最終試合日 "+last.replace(/-/g,"/")+"）";

  function short(n){return n.replace(/^(ＫＵＲＯＢＥ)/,"KUROBE")}
  function renderPicker(){
    $("picker").innerHTML = names.map(function(n){
      return '<button type="button" data-t="'+esc(n)+'" aria-pressed="'+(n===cur)+'">'+esc(n)+'</button>';
    }).join("");
  }
  $("picker").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    cur=b.getAttribute("data-t"); try{localStorage.setItem(KEY,cur)}catch(x){}
    renderPicker(); render(); window.scrollTo(0,0);
  });

  function badge(n){return '<span class="badge">'+esc(n)+'</span>'}
  // p: ポジション1..6の[背番号,氏名]。表示は 上段 4,3,2 / 下段 5,6,1
  function court(p){
    var order=[4,3,2,5,6,1];
    return '<div class="court">'+order.map(function(pos){
      var x=p[pos-1]||["",""];
      return '<div class="cell">'+badge(x[0])+'<div class="nm">'+esc(x[1])+'</div><span class="pos">P'+pos+(pos===1?"・サーブ":"")+'</span></div>';
    }).join("")+'</div>';
  }
  function libs(lb){
    if(!lb||!lb.length) return "";
    return '<div class="libs">'+lb.map(function(l){
      return '<span class="lbl"><span class="badge">'+esc(l[0])+'<span class="l">L</span></span>'+esc(l[1])+'</span>';
    }).join("")+'</div>';
  }
  function wd(m){return m.d.slice(5).replace("-","/")+"("+m.wd+")"}
  function card(m){
    var home = m.h===cur, opp = home?m.a:m.h;
    var mine = home?m.hs:m.as, theirs = home?m.as:m.hs;
    var res, cls;
    if(m.st==="played"){ res=(mine>theirs?"勝 ":"負 ")+mine+"-"+theirs; cls=mine>theirs?"w":"l"; }
    else { res="予定"; cls="p"; }
    var h='<article class="m"><div class="mh"><div class="vs"><span class="ha">'+(home?"HOME":"AWAY")+'</span>vs '+esc(opp)+'</div><div class="res '+cls+'">'+res+'</div></div>';
    h+='<div class="meta">第'+m.r+'節 GAME'+m.g+' ・ '+wd(m)+' ・ '+esc(m.v)+(m.vn?'（'+esc(m.vn)+'）':'')+
       (m.st==="played"?' ・ <a href="'+esc(m.fu)+'" target="_blank" rel="noopener">公式帳票B</a>':'')+'</div>';
    if(m.st!=="played"){
      h+='<div class="note">'+esc(m.note||"未実施")+'。実施後に自動で反映されます。</div></article>'; return h;
    }
    var mine_lu=(m.L||[]).filter(function(l){return l.t===cur}).sort(function(a,b){return a.s-b.s});
    h+='<div class="sets">'+mine_lu.map(function(l){
      var sc=m.ss[l.s-1]||"";
      if(sc){var q=sc.split("-"); sc=home?(q[0]+"-"+q[1]):(q[1]+"-"+q[0]);}
      return '<div class="set"><div class="sh"><b>第'+l.s+'セット</b><span>'+esc(sc)+'</span></div>'+court(l.p)+libs(l.lb)+(l.n?'<div class="note">'+esc(l.n)+'</div>':'')+'</div>';
    }).join("")+'</div></article>';
    return h;
  }
  function render(){
    var ms=MATCHES.filter(function(m){return m.h===cur||m.a===cur})
      .sort(function(a,b){return b.d.localeCompare(a.d)||b.g-a.g});
    if(!ms.length){$("main").innerHTML='<div class="empty">試合がありません</div>';return}
    var out="",round=null;
    ms.forEach(function(m){
      if(m.r!==round){round=m.r;out+='<h2>第'+round+'節</h2>'}
      out+=card(m);
    });
    $("main").innerHTML=out;
  }
  renderPicker(); render();
})();
</script>
</body>
</html>
